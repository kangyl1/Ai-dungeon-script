name: Test Continuity Kit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build bundled script
        run: python3 build.py
      - name: Run test suites
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.cjs; do
            node "$test_file"
          done

